<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Login · Ótica Grau Divino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-container { max-width: 450px; width: 100%; margin: 0 auto; }
    .login-card {
      background: #ffffff;
      border-radius: 48px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(252, 84, 4, 0.1);
    }
    .logo-area { text-align: center; margin-bottom: 32px; }
    .logo-image {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 28px;
    }
    .subtitle { color: #6b7280; font-size: 0.9rem; margin-bottom: 32px; text-align: center; }
    .input-group { margin-bottom: 24px; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #2f3547; }
    .input-with-icon { position: relative; }
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 1.1rem;
    }
    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 1rem;
      border: 1.5px solid #e2e6ee;
      border-radius: 24px;
      background: #fafbfc;
      transition: all 0.2s;
      outline: none;
    }
    input:focus { border-color: #fc5404; background: white; box-shadow: 0 0 0 3px rgba(252,84,4,0.1); }
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: #fc5404;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 8px;
    }
    .btn-login:hover { background: #e04a02; transform: scale(1.02); }
    .btn-login:disabled { background: #ccc; cursor: not-allowed; transform: none; }
    .btn-continue {
      width: 100%;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 12px;
    }
    .btn-continue:hover { background: #16a34a; transform: scale(1.02); }
    .btn-logout {
      width: 100%;
      background: transparent;
      border: 1.5px solid #e2e6ee;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #5f647e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      margin-top: 16px;
    }
    .btn-logout:hover { background: #fee2e2; border-color: #e74c3c; color: #e74c3c; }
    .alert-error {
      background: #fee2e2;
      border-left: 4px solid #e74c3c;
      padding: 12px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #c0392b;
    }
    .alert-success {
      background: #e8f5e9;
      border-left: 4px solid #25d366;
      padding: 12px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #1e7e34;
    }
    .user-session {
      background: #f0fdf4;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #bbf7d0;
    }
    .user-session-info { display: flex; align-items: center; gap: 12px; }
    .user-session-info i { font-size: 1.5rem; color: #22c55e; }
    .user-session-info span { font-weight: 600; color: #166534; }
    .btn-logout-session {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 30px;
    }
    .btn-logout-session:hover { background: #fee2e2; }
    .sync-status {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 16px;
      color: #94a3b8;
    }
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }
    .loading-spinner {
      background: white;
      padding: 20px 30px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      color: #fc5404;
    }
    .loading-spinner i { font-size: 1.5rem; animation: spin 1s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="logo-area">
      <div style="font-size: 3rem; color: #fc5404; margin-bottom: 10px;">
        <i class="fas fa-glasses"></i>
      </div>
      <div class="subtitle">Ótica Grau Divino - Sistema de Orçamentos</div>
    </div>

    <div id="activeSessionDiv" style="display: none;" class="user-session">
      <div class="user-session-info">
        <i class="fas fa-user-check"></i>
        <span id="activeUserName">---</span>
      </div>
      <button id="logoutFromSessionBtn" class="btn-logout-session">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>

    <div id="loginFormDiv">
      <div id="errorMessage" style="display: none;" class="alert-error">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText">Usuário ou senha incorretos!</span>
      </div>

      <div class="input-group">
        <label>Login</label>
        <div class="input-with-icon">
          <i class="fas fa-user"></i>
          <input type="text" id="loginUser" placeholder="Digite seu login">
        </div>
      </div>

      <div class="input-group">
        <label>Senha</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Digite sua senha">
        </div>
      </div>

      <button class="btn-login" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Entrar
      </button>
    </div>

    <div id="logoutArea" style="display: none;">
      <button id="logoutBtn" class="btn-logout">
        <i class="fas fa-sign-out-alt"></i> Sair / Trocar de Atendente
      </button>
    </div>
    
    <div class="sync-status" id="syncStatus">
      <i class="fas fa-sync-alt fa-spin"></i> Carregando...
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"><i class="fas fa-spinner"></i> Carregando...</div>
</div>

<script>
  // ========== SUPABASE CONFIG ==========
  const SUPABASE_URL = 'https://ywzjyoqqnweinrwbbnza.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3emp5b3FxbndlaW5yd2JibnphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODA5ODcsImV4cCI6MjA5MjQ1Njk4N30.6Rf26bE_yeE2NwJgggyGa-GrgM4bpMgaTvwQ_QiyPs0';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Dados padrão para fallback imediato
  const FALLBACK_ATENDENTES = [
    { id: 1, nome: "Jaúna Constante", login: "jauna", senha: "176320", email: "jauna@oticagraudivino.com", ativo: true, isAdmin: true },
    { id: 2, nome: "Jaciara Constante", login: "jaciara", senha: "176320", email: "jaciara@oticagraudivino.com", ativo: true, isAdmin: true },
    { id: 3, nome: "Luana Paloschi", login: "luana", senha: "luana456", email: "luana@oticagraudivino.com", ativo: true, isAdmin: false },
    { id: 4, nome: "Aline", login: "aline", senha: "aline789", email: "aline@oticagraudivino.com", ativo: true, isAdmin: false },
    { id: 5, nome: "Amailson Gawlinski", login: "amailson", senha: "amailson123", email: "amailson@oticagraudivino.com", ativo: true, isAdmin: false }
  ];

  let atendentes = [];

  function showLoading() {
    document.getElementById('loadingOverlay').style.display = 'flex';
    const btn = document.getElementById('loginBtn');
    if (btn) btn.disabled = true;
  }

  function hideLoading() {
    document.getElementById('loadingOverlay').style.display = 'none';
    const btn = document.getElementById('loginBtn');
    if (btn) btn.disabled = false;
  }

  function showError(msg) {
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    errorText.textContent = msg;
    errorDiv.style.display = 'flex';
    setTimeout(() => { errorDiv.style.display = 'none'; }, 4000);
  }

  function showStatus(msg, isError = false) {
    const statusDiv = document.getElementById('syncStatus');
    if (isError) {
      statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${msg}`;
      statusDiv.style.color = '#e74c3c';
    } else {
      statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
      statusDiv.style.color = '#25d366';
    }
    setTimeout(() => {
      statusDiv.innerHTML = '<i class="fas fa-check-circle"></i> Pronto';
      statusDiv.style.color = '#94a3b8';
    }, 3000);
  }

  // Carrega atendentes - PRIORIZA FALLBACK IMEDIATO para funcionar sempre
  async function carregarAtendentes() {
    showLoading();
    
    // Primeiro, carrega o fallback imediatamente para o sistema funcionar
    const saved = localStorage.getItem('atendentes');
    if (saved) {
      try {
        atendentes = JSON.parse(saved);
        console.log('✅ Atendentes carregados do localStorage:', atendentes.length);
        showStatus(`${atendentes.length} atendente(s) disponível(eis)`);
        hideLoading();
        return true;
      } catch(e) {}
    }
    
    // Se não tem saved, usa fallback
    atendentes = [...FALLBACK_ATENDENTES];
    localStorage.setItem('atendentes', JSON.stringify(atendentes));
    console.log('✅ Atendentes carregados do fallback:', atendentes.length);
    showStatus(`${atendentes.length} atendente(s) disponível(eis)`);
    
    // Tenta sincronizar com Supabase em segundo plano
    sincronizarComSupabase();
    
    hideLoading();
    return true;
  }

  // Sincronização em segundo plano com Supabase
  async function sincronizarComSupabase() {
    try {
      const { data, error } = await supabase
        .from('atendentes')
        .select('id, nome, login, senha, email, ativo, is_admin');
      
      if (error) throw error;
      
      if (data && data.length > 0) {
        const supabaseAtendentes = data.map(a => ({
          id: a.id,
          nome: a.nome,
          login: a.login,
          senha: a.senha,
          email: a.email,
          ativo: a.ativo,
          isAdmin: a.is_admin
        }));
        
        // Atualiza apenas se tiver dados novos
        if (supabaseAtendentes.length > 0) {
          atendentes = supabaseAtendentes;
          localStorage.setItem('atendentes', JSON.stringify(atendentes));
          console.log('🔄 Sincronizado com Supabase:', atendentes.length);
          showStatus('Sincronizado com o banco de dados');
        }
      }
    } catch (error) {
      console.log('Erro na sincronização com Supabase (offline):', error.message);
      // Não mostra erro para o usuário, apenas continua com fallback
    }
  }

  function validarLogin(login, senha) {
    const userFound = atendentes.find(a => 
      a.ativo === true && 
      a.login && 
      a.login.toLowerCase() === login.toLowerCase() && 
      a.senha === senha
    );
    
    if (userFound) {
      return {
        nomeExibicao: userFound.nome,
        login: userFound.login,
        isAdmin: userFound.isAdmin === true,
        id: userFound.id
      };
    }
    return null;
  }

  function updateUIAfterLogin() {
    const usuarioSalvo = localStorage.getItem('usuarioLogado');
    const activeSessionDiv = document.getElementById('activeSessionDiv');
    const loginFormDiv = document.getElementById('loginFormDiv');
    const logoutArea = document.getElementById('logoutArea');
    
    if (usuarioSalvo) {
      try {
        const user = JSON.parse(usuarioSalvo);
        const timestamp = new Date(user.loginTimestamp);
        const agora = new Date();
        const diffHoras = (agora - timestamp) / (1000 * 60 * 60);
        
        if (diffHoras > 8) {
          localStorage.removeItem('usuarioLogado');
          updateUIAfterLogin();
          return;
        }
        
        if (activeSessionDiv) activeSessionDiv.style.display = 'flex';
        if (loginFormDiv) loginFormDiv.style.display = 'none';
        if (logoutArea) logoutArea.style.display = 'block';
        
        document.getElementById('activeUserName').textContent = user.nome;
        
        // Remove botão continuar existente se houver
        const oldBtn = document.getElementById('goToOrcamentoBtn');
        if (oldBtn) oldBtn.remove();
        
        // Adiciona botão continuar
        const continueBtn = document.createElement('button');
        continueBtn.id = 'goToOrcamentoBtn';
        continueBtn.className = 'btn-continue';
        continueBtn.innerHTML = '<i class="fas fa-arrow-right"></i> Continuar para Orçamentos';
        continueBtn.onclick = () => { window.location.href = 'orcamento.html'; };
        
        // Insere antes do logoutArea
        if (logoutArea && logoutArea.parentNode) {
          logoutArea.parentNode.insertBefore(continueBtn, logoutArea);
        }
        
      } catch(e) {
        localStorage.removeItem('usuarioLogado');
        updateUIAfterLogin();
      }
    } else {
      if (activeSessionDiv) activeSessionDiv.style.display = 'none';
      if (loginFormDiv) loginFormDiv.style.display = 'block';
      if (logoutArea) logoutArea.style.display = 'none';
      
      const oldBtn = document.getElementById('goToOrcamentoBtn');
      if (oldBtn) oldBtn.remove();
      
      document.getElementById('loginUser').value = '';
      document.getElementById('loginPassword').value = '';
    }
  }

  function logout() {
    localStorage.removeItem('usuarioLogado');
    sessionStorage.removeItem('auth');
    updateUIAfterLogin();
    showStatus('Sessão encerrada');
  }

  function handleLogin() {
    const login = document.getElementById('loginUser').value.trim().toLowerCase();
    const senha = document.getElementById('loginPassword').value.trim();
    
    if (login === '' || senha === '') {
      showError('Preencha ambos os campos!');
      return;
    }
    
    const user = validarLogin(login, senha);
    
    if (!user) {
      showError('Login ou senha incorretos!');
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginPassword').focus();
      return;
    }
    
    // Salva sessão
    localStorage.setItem('usuarioLogado', JSON.stringify({
      nome: user.nomeExibicao,
      login: user.login,
      isAdmin: user.isAdmin,
      loginTimestamp: new Date().toISOString()
    }));
    sessionStorage.setItem('auth', 'true');
    
    showStatus(`Bem-vindo(a), ${user.nomeExibicao}!`);
    updateUIAfterLogin();
  }

  // Eventos
  document.getElementById('loginBtn').addEventListener('click', handleLogin);
  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('logoutFromSessionBtn').addEventListener('click', logout);
  
  document.getElementById('loginPassword').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
  
  document.getElementById('loginUser').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('loginPassword').focus();
  });

  // Inicialização
  async function init() {
    showLoading();
    await carregarAtendentes();
    updateUIAfterLogin();
    hideLoading();
    
    // Tenta sincronizar em segundo plano após 2 segundos
    setTimeout(() => {
      sincronizarComSupabase();
    }, 2000);
    
    console.log('✅ Sistema pronto!');
    console.log('Credenciais disponíveis:', atendentes.map(a => ({ login: a.login, senha: a.senha, nome: a.nome })));
  }
  
  init();
</script>
</body>
</html>
