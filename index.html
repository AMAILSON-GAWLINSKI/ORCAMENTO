<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Login · Ótica Grau Divino</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f5f7fc 0%, #eef2f8 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
    }

    .login-card {
      background: #ffffff;
      border-radius: 48px;
      padding: 40px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(252, 84, 4, 0.1);
      transition: transform 0.2s ease;
    }

    .login-card:hover {
      transform: translateY(-2px);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-image {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 20px;
      border-radius: 28px;
      background: transparent;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));
      transition: transform 0.3s ease;
    }

    .logo-image:hover {
      transform: scale(1.02);
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 32px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: #2f3547;
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #9ca3af;
      font-size: 1.1rem;
    }

    input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      font-size: 1rem;
      font-family: 'Inter', sans-serif;
      border: 1.5px solid #e2e6ee;
      border-radius: 24px;
      background: #fafbfc;
      transition: all 0.2s;
      outline: none;
      color: #1e1f2a;
      font-weight: 500;
    }

    input:focus {
      border-color: #fc5404;
      background: white;
      box-shadow: 0 0 0 3px rgba(252, 84, 4, 0.1);
    }

    .btn-login {
      width: 100%;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: #fc5404;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn-login:hover {
      background: #e04a02;
      transform: scale(1.02);
      box-shadow: 0 8px 20px rgba(252, 84, 4, 0.3);
    }

    .alert-error {
      background: #fee2e2;
      border-left: 4px solid #e74c3c;
      padding: 12px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #c0392b;
      font-weight: 500;
    }

    .alert-error i {
      font-size: 1.2rem;
    }

    .alert-success {
      background: #e8f5e9;
      border-left: 4px solid #25d366;
      padding: 12px 16px;
      border-radius: 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
      color: #1e7e34;
      font-weight: 500;
    }

    .alert-success i {
      font-size: 1.2rem;
    }

    .user-session {
      background: #f0fdf4;
      border-radius: 20px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #bbf7d0;
    }

    .user-session-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-session-info i {
      font-size: 1.5rem;
      color: #22c55e;
    }

    .user-session-info span {
      font-weight: 600;
      color: #166534;
    }

    .btn-logout-session {
      background: none;
      border: none;
      color: #e74c3c;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 6px 12px;
      border-radius: 30px;
      transition: all 0.2s;
    }

    .btn-logout-session:hover {
      background: #fee2e2;
    }

    .btn-continue {
      width: 100%;
      padding: 14px 24px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      background: #22c55e;
      color: white;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 12px;
    }

    .btn-continue:hover {
      background: #16a34a;
      transform: scale(1.02);
    }
    
    .logout-area {
      margin-top: 20px;
      text-align: center;
      border-top: 1px solid #edeef3;
      padding-top: 20px;
    }

    .btn-logout {
      background: transparent;
      border: 1.5px solid #e2e6ee;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      color: #5f647e;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #fee2e2;
      border-color: #e74c3c;
      color: #e74c3c;
    }

    .sync-status {
      font-size: 0.7rem;
      text-align: center;
      margin-top: 16px;
      color: #94a3b8;
      transition: all 0.3s ease;
    }

    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      backdrop-filter: blur(4px);
    }
    .loading-spinner {
      background: white;
      padding: 20px 30px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 600;
      color: #fc5404;
    }
    .loading-spinner i { font-size: 1.5rem; animation: spin 1s linear infinite; }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .shake-animation {
      animation: shake 0.3s ease-in-out;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card" id="loginCard">
    <div class="logo-area">
      <img src="https://raw.githubusercontent.com/AMAILSON-GAWLINSKI/ORCAMENTO/refs/heads/main/LOGO%20SEM%20FUNDO.png" 
           alt="Ótica Grau Divino Logo" 
           class="logo-image"
           onerror="this.onerror=null; this.style.display='none'; document.getElementById('fallbackIcon').style.display='inline-flex';">
      <div id="fallbackIcon" style="display: none; font-size: 3rem; color: #fc5404;">
        <i class="fas fa-glasses"></i>
      </div>
      <div class="subtitle">Acesse o sistema de orçamentos</div>

    <div id="activeSessionDiv" style="display: none;" class="user-session">

        <i class="fas fa-user-check"></i>
        <span id="activeUserName">---</span>
      </div>
      <button id="logoutFromSessionBtn" class="btn-logout-session" title="Sair e trocar de atendente">
        <i class="fas fa-sign-out-alt"></i> Sair
      </button>
    </div>

    <div id="loginFormDiv">
      <div id="errorMessage" style="display: none;" class="alert-error">
        <i class="fas fa-exclamation-triangle"></i>
        <span id="errorText">Usuário ou senha incorretos!</span>
      </div>

      <div id="successMessage" style="display: none;" class="alert-success">
        <i class="fas fa-check-circle"></i>
        <span id="successText">Login realizado com sucesso!</span>
      </div>

      <div class="input-group">
        <label><i class="fas fa-user"></i> Login</label>
        <div class="input-with-icon">
          <i class="fas fa-user-circle"></i>
          <input type="text" id="loginUser" placeholder="Digite seu login" autocomplete="off">
        </div>
      </div>

      <div class="input-group">
        <label><i class="fas fa-lock"></i> Senha</label>
        <div class="input-with-icon">
          <i class="fas fa-key"></i>
          <input type="password" id="loginPassword" placeholder="Digite sua senha">
        </div>
      </div>

      <button class="btn-login" id="loginBtn">
        <i class="fas fa-arrow-right-to-bracket"></i> Entrar no Sistema
      </button>
    </div>

    <div class="logout-area" id="logoutArea" style="display: none;">
      <button id="logoutBtn" class="btn-logout">
        <i class="fas fa-sign-out-alt"></i> Sair / Trocar de Atendente
      </button>
    </div>
    
    <div class="sync-status" id="syncStatus">
      <i class="fas fa-sync-alt fa-spin"></i> Conectando ao banco de dados...
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"><i class="fas fa-spinner"></i> Carregando...</div>
</div>

<script>
  // ========== SUPABASE CONFIG (MESMA DO ORCAMENTO.HTML) ==========
  const SUPABASE_URL = 'https://ywzjyoqqnweinrwbbnza.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3emp5b3FxbndlaW5yd2JibnphIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4ODA5ODcsImV4cCI6MjA5MjQ1Njk4N30.6Rf26bE_yeE2NwJgggyGa-GrgM4bpMgaTvwQ_QiyPs0';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ==================== ATENDENTES PADRÃO (MESMA ESTRUTURA DO SQL) ====================
  const DEFAULT_ATENDENTES = [
    { nome: "Jaúna Constante", login: "jauna", senha: "176320", email: "jauna@oticagraudivino.com", ativo: true, is_admin: true },
    { nome: "Jaciara Constante", login: "jaciara", senha: "176320", email: "jaciara@oticagraudivino.com", ativo: true, is_admin: true },
    { nome: "Luana Paloschi", login: "luana", senha: "luana456", email: "luana@oticagraudivino.com", ativo: true, is_admin: false },
    { nome: "Aline", login: "aline", senha: "aline789", email: "aline@oticagraudivino.com", ativo: true, is_admin: false },
    { nome: "Amailson Gawlinski", login: "amailson", senha: "amailson123", email: "amailson@oticagraudivino.com", ativo: true, is_admin: false }
  ];

  let atendentes = [];

  // ========== FUNÇÕES DE UI ==========
  function showLoading() {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = 'flex';
  }

  function hideLoading() {
    const overlay = document.getElementById('loadingOverlay');
    if (overlay) overlay.style.display = 'none';
  }

  function showSyncStatus(message, isError = false, isSuccess = false) {
    const statusDiv = document.getElementById('syncStatus');
    if (!statusDiv) return;
    
    if (isError) {
      statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle"></i> ${message}`;
      statusDiv.style.color = '#e74c3c';
    } else if (isSuccess) {
      statusDiv.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
      statusDiv.style.color = '#25d366';
    } else {
      statusDiv.innerHTML = `<i class="fas fa-info-circle"></i> ${message}`;
      statusDiv.style.color = '#94a3b8';
    }
    
    // Remove o estilo após 4 segundos
    setTimeout(() => {
      if (statusDiv && !statusDiv.innerHTML.includes('Conectando')) {
        statusDiv.style.opacity = '0.5';
        setTimeout(() => {
          if (statusDiv) {
            statusDiv.style.opacity = '1';
            statusDiv.style.color = '#94a3b8';
          }
        }, 2000);
      }
    }, 4000);
  }

  function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    if (errorDiv && errorText) {
      errorText.textContent = message || 'Usuário ou senha incorretos!';
      errorDiv.style.display = 'flex';
    }
    
    const successDiv = document.getElementById('successMessage');
    if (successDiv) successDiv.style.display = 'none';
    
    const card = document.querySelector('.login-card');
    if (card) {
      card.classList.add('shake-animation');
      setTimeout(() => card.classList.remove('shake-animation'), 300);
    }
    
    setTimeout(() => {
      if (errorDiv) errorDiv.style.display = 'none';
    }, 3000);
  }

  function showSuccess(message) {
    const successDiv = document.getElementById('successMessage');
    const successText = document.getElementById('successText');
    if (successDiv && successText) {
      successText.textContent = message || 'Login realizado com sucesso!';
      successDiv.style.display = 'flex';
    }
    
    const errorDiv = document.getElementById('errorMessage');
    if (errorDiv) errorDiv.style.display = 'none';
    
    setTimeout(() => {
      if (successDiv) successDiv.style.display = 'none';
    }, 3000);
  }

  function clearError() {
    const errorDiv = document.getElementById('errorMessage');
    if (errorDiv) errorDiv.style.display = 'none';
  }

  // ========== FUNÇÕES DE SINCRONIZAÇÃO COM SUPABASE ==========
  
  // Sincroniza atendentes do Supabase para o localStorage
  async function sincronizarAtendentesDoSupabase() {
    showLoading();
    try {
      // Busca atendentes do Supabase
      const { data, error } = await supabase
        .from('atendentes')
        .select('*')
        .order('id');
      
      if (error) {
        console.error('Erro ao buscar atendentes:', error);
        throw error;
      }
      
      if (data && data.length > 0) {
        // Converte os dados para o formato usado no frontend
        atendentes = data.map(a => ({
          id: a.id,
          nome: a.nome,
          login: a.login,
          senha: a.senha,
          email: a.email,
          ativo: a.ativo === true,
          isAdmin: a.is_admin === true,
          criado_em: a.criado_em
        }));
        
        // Salva no localStorage para fallback offline
        localStorage.setItem('atendentes', JSON.stringify(atendentes));
        
        console.log('✅ Atendentes sincronizados do Supabase:', atendentes.length);
        showSyncStatus(`${atendentes.length} atendentes sincronizados`, false, true);
        return true;
      } else {
        console.log('Nenhum atendente encontrado no Supabase. Inserindo dados padrão...');
        return await inserirAtendentesPadrao();
      }
    } catch (error) {
      console.error('Erro na sincronização:', error);
      
      // Fallback: tenta carregar do localStorage
      const saved = localStorage.getItem('atendentes');
      if (saved) {
        try {
          atendentes = JSON.parse(saved);
          console.log('⚠️ Usando atendentes do localStorage (fallback)');
          showSyncStatus('Usando dados locais (offline)', true);
          return true;
        } catch(e) {
          console.error('Erro ao ler localStorage:', e);
        }
      }
      
      // Último recurso: usar dados padrão
      atendentes = DEFAULT_ATENDENTES.map((a, index) => ({
        id: index + 1,
        ...a,
        isAdmin: a.is_admin
      }));
      localStorage.setItem('atendentes', JSON.stringify(atendentes));
      showSyncStatus('Erro de conexão. Usando configuração local.', true);
      return false;
    } finally {
      hideLoading();
    }
  }

  // Insere os atendentes padrão no Supabase
  async function inserirAtendentesPadrao() {
    showLoading();
    try {
      // Verifica se já existem atendentes
      const { count, error: countError } = await supabase
        .from('atendentes')
        .select('*', { count: 'exact', head: true });
      
      if (countError) throw countError;
      
      if (count === 0) {
        // Insere os atendentes padrão
        const { data, error } = await supabase
          .from('atendentes')
          .insert(DEFAULT_ATENDENTES)
          .select();
        
        if (error) throw error;
        
        if (data) {
          atendentes = data.map(a => ({
            id: a.id,
            nome: a.nome,
            login: a.login,
            senha: a.senha,
            email: a.email,
            ativo: a.ativo === true,
            isAdmin: a.is_admin === true,
            criado_em: a.criado_em
          }));
          localStorage.setItem('atendentes', JSON.stringify(atendentes));
          console.log('✅ Atendentes padrão inseridos com sucesso');
          showSyncStatus('Atendentes cadastrados com sucesso!', false, true);
          return true;
        }
      } else {
        // Se já existem, apenas sincroniza
        return await sincronizarAtendentesDoSupabase();
      }
    } catch (error) {
      console.error('Erro ao inserir atendentes padrão:', error);
      showSyncStatus('Erro ao sincronizar com o banco de dados', true);
      return false;
    } finally {
      hideLoading();
    }
  }

  // ========== VALIDAÇÃO DE LOGIN ==========
  function validarLogin(login, senha) {
    console.log('🔐 Tentando login:', login);
    console.log('📋 Atendentes disponíveis:', atendentes.map(a => ({ 
      login: a.login, 
      nome: a.nome, 
      ativo: a.ativo, 
      isAdmin: a.isAdmin 
    })));
    
    const userFound = atendentes.find(atendente => 
      atendente.ativo === true && 
      atendente.login && 
      atendente.login.toLowerCase() === login.toLowerCase() && 
      atendente.senha === senha
    );
    
    if (userFound) {
      console.log('✅ Usuário encontrado:', userFound.nome, 'Admin:', userFound.isAdmin);
      return {
        nomeExibicao: userFound.nome,
        login: userFound.login,
        isAdmin: userFound.isAdmin === true,
        id: userFound.id
      };
    }
    console.log('❌ Usuário não encontrado ou credenciais inválidas');
    return null;
  }

  // ========== GERENCIAMENTO DE SESSÃO ==========
  function removeContinueButton() {
    const continueBtn = document.getElementById('goToOrcamentoBtn');
    if (continueBtn && continueBtn.parentNode) {
      continueBtn.parentNode.removeChild(continueBtn);
    }
  }

  function updateUIBasedOnSession() {
    const usuarioSalvo = localStorage.getItem('usuarioLogado');
    const activeSessionDiv = document.getElementById('activeSessionDiv');
    const loginFormDiv = document.getElementById('loginFormDiv');
    const logoutArea = document.getElementById('logoutArea');
    
    removeContinueButton();
    
    if (usuarioSalvo) {
      try {
        const user = JSON.parse(usuarioSalvo);
        const timestamp = new Date(user.loginTimestamp);
        const agora = new Date();
        const diffHoras = (agora - timestamp) / (1000 * 60 * 60);
        
        // Sessão expira após 8 horas
        if (diffHoras > 8) {
          localStorage.removeItem('usuarioLogado');
          sessionStorage.removeItem('auth');
          updateUIBasedOnSession();
          return;
        }
        
        if (activeSessionDiv) activeSessionDiv.style.display = 'flex';
        if (loginFormDiv) loginFormDiv.style.display = 'none';
        if (logoutArea) logoutArea.style.display = 'block';
        
        const activeUserName = document.getElementById('activeUserName');
        if (activeUserName) activeUserName.textContent = user.nome;
        
        const loginCard = document.getElementById('loginCard');
        if (loginCard && !document.getElementById('goToOrcamentoBtn')) {
          const continueButton = document.createElement('button');
          continueButton.id = 'goToOrcamentoBtn';
          continueButton.className = 'btn-continue';
          continueButton.innerHTML = '<i class="fas fa-arrow-right"></i> Continuar no Sistema de Orçamentos';
          continueButton.onclick = () => {
            window.location.href = 'orcamento.html';
          };
          
          if (logoutArea && logoutArea.parentNode) {
            logoutArea.parentNode.insertBefore(continueButton, logoutArea.nextSibling);
          } else if (loginCard) {
            loginCard.appendChild(continueButton);
          }
        }
        
      } catch(e) {
        console.error('Erro ao ler sessão', e);
        localStorage.removeItem('usuarioLogado');
        sessionStorage.removeItem('auth');
        if (activeSessionDiv) activeSessionDiv.style.display = 'none';
        if (loginFormDiv) loginFormDiv.style.display = 'block';
        if (logoutArea) logoutArea.style.display = 'none';
        removeContinueButton();
      }
    } else {
      if (activeSessionDiv) activeSessionDiv.style.display = 'none';
      if (loginFormDiv) loginFormDiv.style.display = 'block';
      if (logoutArea) logoutArea.style.display = 'none';
      removeContinueButton();
      
      const userInput = document.getElementById('loginUser');
      const passInput = document.getElementById('loginPassword');
      if (userInput) userInput.value = '';
      if (passInput) passInput.value = '';
    }
  }

  function logout() {
    localStorage.removeItem('usuarioLogado');
    sessionStorage.removeItem('auth');
    localStorage.removeItem('orcamentosTemp');
    localStorage.removeItem('nextIdTemp');
    
    const userInput = document.getElementById('loginUser');
    const passInput = document.getElementById('loginPassword');
    if (userInput) userInput.value = '';
    if (passInput) passInput.value = '';
    
    removeContinueButton();
    updateUIBasedOnSession();
    
    const errorDiv = document.getElementById('errorMessage');
    if (errorDiv) errorDiv.style.display = 'none';
    
    showSyncStatus('Sessão encerrada. Faça login novamente.', false);
  }

  async function handleLogin() {
    const loginInput = document.getElementById('loginUser');
    const passwordInput = document.getElementById('loginPassword');
    
    const login = loginInput?.value?.trim()?.toLowerCase() || '';
    const password = passwordInput?.value?.trim() || '';
    
    if (login === '' || password === '') {
      showError('Por favor, preencha ambos os campos!');
      return;
    }
    
    // Garante que os atendentes estão carregados
    if (atendentes.length === 0) {
      showSyncStatus('Carregando dados do sistema...', false);
      await sincronizarAtendentesDoSupabase();
    }
    
    const user = validarLogin(login, password);
    
    if (!user) {
      showError('❌ Login ou senha incorretos! Tente novamente.');
      if (passwordInput) passwordInput.value = '';
      if (passwordInput) passwordInput.focus();
      return;
    }
    
    showSuccess(`✅ Bem-vindo(a), ${user.nomeExibicao}!`);
    
    localStorage.setItem('usuarioLogado', JSON.stringify({
      nome: user.nomeExibicao,
      login: user.login,
      isAdmin: user.isAdmin,
      loginTimestamp: new Date().toISOString()
    }));
    sessionStorage.setItem('auth', 'true');
    
    updateUIBasedOnSession();
    
    // Redireciona para o sistema de orçamentos
    setTimeout(() => {
      window.location.href = 'orcamento.html';
    }, 800);
  }

  // ========== MONITORAMENTO EM TEMPO REAL ==========
  function iniciarMonitoramentoAtendentes() {
    // Monitora mudanças no localStorage de outras abas
    window.addEventListener('storage', function(event) {
      if (event.key === 'atendentes') {
        console.log('🔄 Atendentes atualizados em outra aba/janela');
        const saved = localStorage.getItem('atendentes');
        if (saved) {
          try {
            atendentes = JSON.parse(saved);
            updateUIBasedOnSession();
            showSyncStatus('Lista de atendentes atualizada', false);
          } catch(e) {
            console.error('Erro ao processar atualização:', e);
          }
        }
      }
    });
    
    // Sincronização periódica com o Supabase (a cada 5 minutos)
    setInterval(async () => {
      if (navigator.onLine) {
        console.log('🔄 Sincronizando atendentes com o Supabase...');
        await sincronizarAtendentesDoSupabase();
        updateUIBasedOnSession();
      }
    }, 300000); // 5 minutos
  }

  // ========== VERIFICAR SESSÃO EXISTENTE ==========
  function verificarSessaoExistente() {
    const usuarioSalvo = localStorage.getItem('usuarioLogado');
    if (usuarioSalvo) {
      try {
        const user = JSON.parse(usuarioSalvo);
        const timestamp = new Date(user.loginTimestamp);
        const agora = new Date();
        const diffHoras = (agora - timestamp) / (1000 * 60 * 60);
        
        if (diffHoras <= 8) {
          updateUIBasedOnSession();
          return true;
        } else {
          localStorage.removeItem('usuarioLogado');
        }
      } catch(e) {
        console.error('Erro ao verificar sessão:', e);
        localStorage.removeItem('usuarioLogado');
      }
    }
    return false;
  }

  // ========== INICIALIZAÇÃO ==========
  async function init() {
    console.log('🚀 Inicializando sistema de login...');
    showLoading();
    
    // Verifica conectividade
    if (!navigator.onLine) {
      showSyncStatus('⚠️ Modo offline - usando dados locais', true);
    }
    
    // Carrega atendentes do Supabase
    await sincronizarAtendentesDoSupabase();
    
    // Verifica se já existe sessão ativa
    verificarSessaoExistente();
    
    // Atualiza UI
    updateUIBasedOnSession();
    
    // Inicia monitoramento
    iniciarMonitoramentoAtendentes();
    
    hideLoading();
    
    // Tratamento da imagem do logo
    const logoImg = document.querySelector('.logo-image');
    if (logoImg) {
      logoImg.addEventListener('error', function() {
        this.style.display = 'none';
        const fallback = document.getElementById('fallbackIcon');
        if (fallback) fallback.style.display = 'inline-flex';
      });
    }
    
    console.log('✅ Sistema inicializado com sucesso');
  }

  // ========== EVENT LISTENERS ==========
  const loginBtn = document.getElementById('loginBtn');
  const passwordField = document.getElementById('loginPassword');
  const userField = document.getElementById('loginUser');
  const logoutBtn = document.getElementById('logoutBtn');
  const logoutFromSessionBtn = document.getElementById('logoutFromSessionBtn');
  
  if (loginBtn) loginBtn.addEventListener('click', handleLogin);
  if (logoutBtn) logoutBtn.addEventListener('click', logout);
  if (logoutFromSessionBtn) logoutFromSessionBtn.addEventListener('click', logout);
  
  if (passwordField) {
    passwordField.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        handleLogin();
      }
    });
  }
  
  if (userField) {
    userField.addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        event.preventDefault();
        if (passwordField) passwordField.focus();
      }
    });
    userField.addEventListener('input', clearError);
  }
  
  if (passwordField) {
    passwordField.addEventListener('input', clearError);
  }
  
  // Inicia a aplicação quando a página carregar
  window.addEventListener('DOMContentLoaded', init);
</script>
